<!doctype html>
<!--
  Open Graph 대표 이미지(1200×630) 원본.
  수정 후 다시 만들기 (Chrome 헤드리스):
  chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=assets/og-image.png tools/og-image.html
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG 이미지</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Gowun Dodum', sans-serif; color: #5A3D28;
    background-color: #F3E2C6;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 178px, rgba(154, 106, 65, .16) 178px 180px),
      repeating-linear-gradient(0deg, transparent 0 9px, rgba(154, 106, 65, .045) 9px 11px, transparent 11px 27px),
      radial-gradient(ellipse at 15% 0%, rgba(205, 239, 224, .85), transparent 55%),
      radial-gradient(ellipse at 95% 100%, rgba(255, 224, 138, .6), transparent 50%),
      linear-gradient(180deg, #F7EAD3, #EBD5B3);
  }
  .leaf { position: absolute; color: #9EDCC2; opacity: .85; }
  .card {
    position: absolute; inset: 40px;
    display: grid; grid-template-columns: 1fr 450px; align-items: center; gap: 24px;
    padding: 44px 50px;
    background: rgba(255, 253, 247, .94); border: 4px solid #D9B98E; border-radius: 40px;
    box-shadow: 0 10px 0 rgba(154, 106, 65, .18);
  }
  .chip {
    display: inline-block; padding: 6px 18px; border-radius: 999px;
    background: #CDEFE0; color: #24705A; font-family: 'Jua', sans-serif; font-size: 26px;
  }
  h1 {
    margin-top: 18px; font-family: 'Jua', sans-serif; font-weight: 400;
    font-size: 92px; line-height: 1.05; color: #24705A; text-shadow: 0 6px 0 #FFE08A;
  }
  .sub { margin-top: 18px; font-family: 'Jua', sans-serif; font-size: 44px; color: #9A6A41; }
  .feats { display: flex; gap: 10px; margin-top: 30px; }
  .feats span {
    padding: 8px 14px; border-radius: 16px; font-size: 21px; white-space: nowrap;
    background: #FFF3C4; border: 2px solid #F2B937;
  }
  .art { position: relative; height: 462px; }
  .art svg, .art img { position: absolute; }
</style>
</head>
<body>
  <svg class="leaf" style="left:-20px;top:-24px;width:140px;height:140px;transform:rotate(-20deg)" viewBox="0 0 60 60"><path d="M8 52C8 24 24 8 52 8c0 28-16 44-44 44z" fill="currentColor"/></svg>
  <svg class="leaf" style="right:-26px;bottom:-30px;width:170px;height:170px;color:#FFE7A3;transform:rotate(160deg)" viewBox="0 0 60 60"><path d="M8 52C8 24 24 8 52 8c0 28-16 44-44 44z" fill="currentColor"/></svg>

  <div class="card">
    <div>
      <span class="chip">중학교 3학년 수학</span>

      <div class="feats">
        <span>✋ 드래그 시각화</span>
        <span>💡 단계별 힌트</span>
        <span>🌰 도토리 보상</span>
      </div>
    </div>

    <div class="art">
      <!-- 원주각 · 중심각 -->
      <svg style="left:160px;top:0;width:290px;height:280px" viewBox="0 0 300 290">
        <circle cx="150" cy="140" r="115" fill="#FFFBEF" stroke="#9A6A41" stroke-width="5"/>
        <path d="M68.7 221.3A115 115 0 0 0 231.3 221.3" fill="none" stroke="#F2B937" stroke-width="12" stroke-linecap="round"/>
        <path d="M150 25 68.7 221.3M150 25l81.3 196.3" stroke="#EF7F6E" stroke-width="6" stroke-linecap="round"/>
        <path d="M68.7 221.3 150 140l81.3 81.3" fill="none" stroke="#3FA582" stroke-width="6" stroke-linejoin="round"/>

        <path d="M129 161A30 30 0 0 0 171 161" fill="none" stroke="#3FA582" stroke-width="4"/>

      <!-- 직각삼각형 -->

      </svg>
      <!-- 다람쥐 -->
      <svg style="left:275px;top:290px;width:175px;height:175px" viewBox="0 0 80 80">
        <path d="M50 72c20-2 30-22 22-40-6-14-22-18-26-6-3 10 10 14 12 24 2 10-4 16-8 22z" fill="#B87333"/>
        <path d="M54 30c6 0 12 6 12 14" stroke="#D99A5B" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="34" cy="57" rx="19" ry="17" fill="#C9864A"/>
        <ellipse cx="33" cy="61" rx="11" ry="11" fill="#F6DDB8"/>

        <path d="m38 15 6-12 2 15z" fill="#C9864A"/>
        <circle cx="33" cy="31" r="16" fill="#C9864A"/>
        <ellipse cx="41" cy="37" rx="8" ry="6" fill="#F6DDB8"/>
        <circle cx="37" cy="28" r="3" fill="#3B2614"/>

        <g transform="translate(26 44)">
          <path d="M2 6c0 8 4 12 6 12s6-4 6-12z" fill="#E8B878"/>
          <path d="M0 7c0-5 4-7 8-7s8 2 8 7z" fill="#8B5A2B"/>
        </g>
        <ellipse cx="25" cy="52" rx="4" ry="3" fill="#B87333"/>
        <ellipse cx="43" cy="52" rx="4" ry="3" fill="#B87333"/>
      </svg>
      <img src="../assets/stamp.svg" alt="" style="left:0;top:0;width:145px;height:145px">
      <img src="../assets/acorn.svg" alt="" style="left:8px;top:175px;width:58px;height:58px">
      <img src="../assets/acorn.svg" alt="" style="left:62px;top:205px;width:50px;height:50px">
      <img src="../assets/acorn.svg" alt="" style="left:104px;top:170px;width:58px;height:58px">
    </div>
  </div>
</body>
</html>
